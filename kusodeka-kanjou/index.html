<!DOCTYPE html>
<html lang="ja">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3771782298256692" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>クソデカ感情変換器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="stage">
    <header class="hero">
      <h1 class="brand">クソデカ感情変換器</h1>
      <p class="tagline">一言を、特撮サブタイ風の極太明朝に変換する。</p>
    </header>

    <section class="workspace" aria-label="変換ワークスペース">
      <div class="preview-wrap">
        <canvas id="preview" width="1080" height="1080" aria-label="プレビュー"></canvas>
      </div>

      <form class="controls" id="controls" autocomplete="off">
        <label class="field">
          <span class="field-label">テキスト</span>
          <input
            type="text"
            id="textInput"
            maxlength="12"
            value="クソデカ"
            placeholder="最大12文字"
            inputmode="text"
          >
          <span class="char-count" id="charCount" aria-live="polite">4 / 12</span>
        </label>

        <fieldset class="field fieldset">
          <legend class="field-label">レイアウト</legend>
          <div class="seg" role="radiogroup" aria-label="レイアウト">
            <label class="seg-item">
              <input type="radio" name="layout" value="don" checked>
              <span>横一文字ドン</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="layout" value="mix">
              <span>縦横混在</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="layout" value="cutin">
              <span>斜めカットイン</span>
            </label>
          </div>
        </fieldset>

        <label class="field toggle-row">
          <span class="field-label">集中線</span>
          <span class="toggle">
            <input type="checkbox" id="speedLines" checked>
            <span class="toggle-ui" aria-hidden="true"></span>
            <span class="toggle-text" id="speedLinesLabel">ON</span>
          </span>
        </label>

        <label class="field">
          <span class="field-label">
            文字の大きさ
            <span class="slider-val" id="sizeLabel">100%</span>
          </span>
          <input type="range" id="fontSize" min="60" max="140" value="100" step="5">
        </label>

        <fieldset class="field fieldset">
          <legend class="field-label">書き出しサイズ</legend>
          <div class="seg" role="radiogroup" aria-label="書き出しサイズ">
            <label class="seg-item">
              <input type="radio" name="exportSize" value="square" checked>
              <span>正方形 1080×1080</span>
            </label>
            <label class="seg-item">
              <input type="radio" name="exportSize" value="wide">
              <span>横長 1200×630</span>
            </label>
          </div>
        </fieldset>

        <button type="button" class="download-btn" id="downloadBtn">PNGをダウンロード</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <a href="../">← ごましおアプリセンターに戻る</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
