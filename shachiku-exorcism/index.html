<!DOCTYPE html>
<html lang="ja">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3771782298256692" crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>社畜タイピング・エクソシズム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="brand">社畜タイピング・エクソシズム</h1>
      <div id="hud" class="hud" hidden>
        <span id="timer" class="hud-item">30</span>
        <span id="score" class="hud-item">除霊 0</span>
      </div>
    </header>

    <main id="stage" class="stage">
      <canvas id="fx" aria-hidden="true"></canvas>
      <div id="spirits" class="spirits" aria-live="polite"></div>

      <section id="screen-start" class="panel">
        <p class="lead">湧き出るビジネス用語の悪霊を、連打で除霊せよ。</p>
        <p class="hint">PC：キー連打　／　スマホ：タップ連打</p>
        <p class="hint sub">制限時間 30 秒 · 除霊数＝スコア</p>
        <button type="button" id="btn-start" class="btn primary">除霊を開始</button>
      </section>

      <section id="screen-result" class="panel" hidden>
        <p class="result-label">本日のストレス浄化率</p>
        <p id="purify" class="purify">0%</p>
        <p id="rank" class="rank"></p>
        <p id="result-score" class="result-score"></p>
        <button type="button" id="btn-retry" class="btn primary">もう一度</button>
      </section>
    </main>

    <footer class="footer">
      <a href="../">← ごましおアプリセンターに戻る</a>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
