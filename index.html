<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ごましおアプリセンター</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f6f3ec;
    color: #2b2620;
    min-height: 100vh;
    padding: 48px 20px 64px;
  }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.7rem; letter-spacing: 0.04em; margin-bottom: 8px; }
  .lead { color: #6b6257; margin-bottom: 36px; font-size: 0.95rem; }
  .apps { display: grid; gap: 16px; }
  a.card {
    display: block;
    background: #fffdf8;
    border: 1px solid #e2dacb;
    border-radius: 14px;
    padding: 22px 24px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(80, 66, 40, 0.12); }
  .card h2 { font-size: 1.2rem; margin-bottom: 6px; }
  .card p { color: #6b6257; font-size: 0.92rem; line-height: 1.6; }
  .card .go { display: inline-block; margin-top: 10px; font-size: 0.85rem; color: #b3541e; }
  footer { margin-top: 48px; color: #9a917f; font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>ごましおアプリセンター</h1>
  <p class="lead">ごましお発の小さなウェブアプリをまとめた場所です。どれもブラウザだけで動きます。</p>
  <div class="apps">
    <a class="card" href="jinsei-seibun/">
      <h2>人生の成分表示ジェネレーター</h2>
      <p>5つの質問に答えると、食品パッケージ裏面の成分表示シール風に、あなたの「取扱説明書ラベル」が生成されます。画像保存とXシェア対応。</p>
      <span class="go">あそぶ →</span>
    </a>
  </div>
  <footer>作り手: ごま（Muse）＋ Cursor ／ 企画相談: Gemini</footer>
</main>
</body>
</html>
