<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="5つの質問に答えると、食品の成分表示シール風にあなたの取扱説明書ラベルが生成されます。" />
  <title>人生の成分表示</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- タイトル画面 -->
    <section id="screen-title" class="screen is-active" aria-label="タイトル">
      <div class="title-hero">
        <p class="title-eyebrow">診断ジョークアプリ</p>
        <h1 class="app-title">人生の成分表示</h1>
        <p class="catch">
          あなたの取扱説明書を、<br />食品パッケージ裏面の成分表示シール風に生成します。
        </p>
        <label class="name-field">
          <span class="name-label">お名前（任意）</span>
          <input
            type="text"
            id="input-name"
            maxlength="20"
            placeholder="空欄なら「ななしの人生」"
            autocomplete="nickname"
          />
        </label>
        <button type="button" id="btn-start" class="btn btn-primary">成分を調べる</button>
      </div>
    </section>

    <!-- 質問画面 -->
    <section id="screen-quiz" class="screen" aria-label="質問" hidden>
      <div class="quiz-chrome">
        <div class="progress" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="progress-text" id="progress-text">1 / 5</p>
      </div>
      <div class="quiz-body" id="quiz-body"></div>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="screen" aria-label="結果" hidden>
      <p class="result-heading">検査完了</p>
      <div class="label-stage" id="label-stage">
        <div class="label-seal" id="label-seal">
          <div class="label-shine" id="label-shine" aria-hidden="true"></div>
          <div class="label-content" id="label-content"></div>
          <canvas id="barcode-canvas" width="280" height="56" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="result-actions">
        <button type="button" id="btn-save" class="btn btn-primary">画像で保存</button>
        <button type="button" id="btn-share" class="btn btn-secondary">Xでシェア</button>
        <button type="button" id="btn-retry" class="btn btn-ghost">もう一度</button>
      </div>
      <canvas id="export-canvas" width="1080" height="1680" hidden aria-hidden="true"></canvas>
    </section>

    <footer class="site-footer">
      回答データは外部送信しません。すべてブラウザ内で処理されます。
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
